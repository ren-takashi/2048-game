name: Build Native Game APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # FIX: Forcing Gradle 8.4 to match Android Plugin 8.1.1
      - name: Generate Compatible Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonHub-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
